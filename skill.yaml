# douyin-pet-track 技能元数据
name: douyin-pet-track
display_name: 宠物赛道抖音爆款对标工具
description: >-
  宠物赛道抖音爆款对标工具——一键拉取红狐 API 的实时热榜 / 宠物关键词搜索 / 动物赛道日榜 /
  七日飙升榜，自动筛选宠物向作品并生成含可点击跳转链接的可视化 HTML 对标报告。
  当用户要做宠物号抖音选题对标、爆款分析、热点捕捉，或想看「动物赛道里哪些宠物内容正在涨」时使用。
version: "1.0.0"
author: jiacheng168
license: MIT
homepage: https://github.com/jiacheng168/douyin-pet-track
tags:
  - 抖音
  - 宠物
  - 爆款对标
  - 热点捕捉
  - 养猫养狗
triggers:
  - "拉一下宠物赛道的热榜+对标"
  - "宠物号抖音选题对标"
  - "动物赛道里哪些宠物内容在涨"
  - "生成宠物赛道对标报告"
  - "douyin pet track"
input:
  - name: --key
    type: string
    required: false
    default: "$REDFOX_API_KEY"
    description: 红狐 API Key；缺省读取环境变量 REDFOX_API_KEY
  - name: --config
    type: path
    required: false
    default: "config.yaml"
    description: 配置文件路径（可改搜索词、宠物关键词、榜单条数等）
  - name: --out
    type: path
    required: false
    description: 输出 HTML 报告路径（缺省读 config output.default_path）
  - name: --date
    type: date
    required: false
    description: 数据日期 YYYY-MM-DD，缺省为昨天
  - name: --search-kw
    type: string
    required: false
    description: 搜索关键词，缺省读 config search.keyword（如 宠物 / 猫咪 / 狗狗）
  - name: --top
    type: int
    required: false
    description: 各榜单展示条数，最大 50，缺省读 config report.top_n
output:
  format: "HTML 报告文件 + 控制台摘要"
  description: >-
    生成可点击跳转链接的可视化 HTML 对标报告（含 KPI 卡片、热榜/搜索/日榜/飙升四张表、
    宠物向高亮、对标锁定与建议），并在控制台打印 热榜/搜索/日榜(宠物向)/飙升(宠物向) 的条数摘要。
runtime:
  language: python
  entry: main.py
  dependencies: "零依赖（仅标准库 urllib）；可选 PyYAML 用于读取 config.yaml，缺失则使用内置默认值"
workflow:
  - "① 热点捕捉：拉取实时全站热榜 + 宠物关键词作品搜索"
  - "② 爆款对标：拉取动物赛道点赞日榜 + 七日点赞飙升榜"
  - "③ 宠物筛选：按 config 中 pet_filter.keywords 命中标题，标记宠物向"
  - "④ 报告生成：输出 HTML 对标报告（含对标锁定与选题建议）"
note: >-
  本技能覆盖抖音爆款内容专家流水线的「阶段①热点捕捉 + 阶段②爆款对标」；
  阶段③文案复刻、阶段④效果验证由同体系其他技能承接。
