# ============================================================
# douyin-pet-track 配置文件
# 说明：本文件可被 main.py 读取（需 PyYAML；若无则使用脚本内置默认值）。
#       所有字段均可按需修改，无需改代码。
# ============================================================

# 红狐 API（数据来源）
redfox:
  api_base: "https://redfox.hk/story/api"
  api_key_env: "REDFOX_API_KEY"          # 从环境变量读取密钥，避免明文落盘
  hotspot_path: "/hotSpot/getListByPlatform"   # 实时热榜
  search_path:  "/dy/data/searchWork"          # 关键词作品搜索
  daily_path:   "/dy/search/likesRank"         # 动物赛道·点赞日榜
  weekly_path:  "/dy/search/hotContentRank"    # 七日/每日飙升榜（靠 source 字段分流：weeklyRank / dailyRank）
  prohibited_path: "/cozeSkill/sensitiveWordSearch"  # 违禁词扫雷

# 搜索环节参数
search:
  keyword: "宠物"        # 默认搜索词；可改为「猫咪」「狗狗」「布偶猫」等
  page_size: 50          # 单次搜索返回条数

# 宠物垂直筛选（标题命中下列任一关键词即判定为「宠物向」）
pet_filter:
  enabled: true
  keywords:
    - "猫"
    - "橘猫"
    - "布偶"
    - "暹罗"
    - "德文"
    - "英短"
    - "美短"
    - "缅因"
    - "波斯"
    - "加菲"
    - "银渐层"
    - "金渐层"
    - "奶猫"
    - "小奶"
    - "小猫"
    - "狸花"
    - "奶牛猫"
    - "猫砂"
    - "铲屎"
    - "哈基米"
    - "咪咪"
    - "大橘"
    - "狗"
    - "修勾"
    - "狗狗"
    - "柴犬"
    - "金毛"
    - "柯基"
    - "泰迪"
    - "比熊"
    - "萨摩"
    - "哈士奇"
    - "猫粮"
    - "狗粮"
    - "宠物"
    - "仓鼠"
    - "兔子"
    - "鹦鹉"
    - "水族"
    - "龟"
    - "异宠"

# 报告输出参数
report:
  top_n: 50                       # 各榜单展示条数（最大 50）
  title: "宠物赛道·抖音热榜+对标报告"
  highlight_label: "宠物向"        # 高亮行标注文字

# 输出文件
output:
  default_path: "宠物赛道对标报告.html"

# 阶段③ 文案复刻：默认赛道 + 风格参考文件（可选）
replicate:
  track: "动物"                 # 从哪个赛道取对标标杆（默认动物）
  style_ref: ""                 # 你的风格/人设参考文本文件路径（可选；留空则靠 --style-ref 传入）
  prompt_out: "复刻写作提示词.md"   # 生成的复刻写作提示词保存路径

# 阶段④ 效果验证：发布后查每日飙升榜的默认赛道
verify:
  track: "动物"
  out: "效果验证_{date}.md"

# 违禁词扫雷参数（阶段③第二环）
prohibited_word:
  platform: "抖音"
  source: "抖音违禁词查询-WorkBuddy"
  max_content_length: 3000      # 单次扫描最大字数，超长自动切块
  max_total_length: 10000
