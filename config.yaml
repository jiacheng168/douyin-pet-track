# ============================================================
# douyin-pet-track 配置文件
# 说明：本文件可被 main.py 读取（需 PyYAML；若无则使用脚本内置默认值）。
#       所有字段均可按需修改，无需改代码。
# ============================================================

# 红狐 API（数据来源）
redfox:
  api_base: "https://redfox.hk/story/api"
  api_key_env: "REDFOX_API_KEY"          # 从环境变量读取密钥，避免明文落盘
  hotspot_path: "/hotSpot/getListByPlatform"   # 实时热榜
  search_path:  "/dy/data/searchWork"          # 关键词作品搜索
  daily_path:   "/dy/search/likesRank"         # 动物赛道·点赞日榜
  weekly_path:  "/dy/search/hotContentRank"    # 动物赛道·七日点赞飙升榜

# 搜索环节参数
search:
  keyword: "宠物"        # 默认搜索词；可改为「猫咪」「狗狗」「布偶猫」等
  page_size: 50          # 单次搜索返回条数

# 宠物垂直筛选（标题命中下列任一关键词即判定为「宠物向」）
pet_filter:
  enabled: true
  keywords:
    - "猫"
    - "橘猫"
    - "布偶"
    - "暹罗"
    - "德文"
    - "英短"
    - "美短"
    - "缅因"
    - "波斯"
    - "加菲"
    - "银渐层"
    - "金渐层"
    - "奶猫"
    - "小奶"
    - "小猫"
    - "狸花"
    - "奶牛猫"
    - "猫砂"
    - "铲屎"
    - "哈基米"
    - "咪咪"
    - "大橘"
    - "狗"
    - "修勾"
    - "狗狗"
    - "柴犬"
    - "金毛"
    - "柯基"
    - "泰迪"
    - "比熊"
    - "萨摩"
    - "哈士奇"
    - "猫粮"
    - "狗粮"
    - "宠物"
    - "仓鼠"
    - "兔子"
    - "鹦鹉"
    - "水族"
    - "龟"
    - "异宠"

# 报告输出参数
report:
  top_n: 50                       # 各榜单展示条数（最大 50）
  title: "宠物赛道·抖音热榜+对标报告"
  highlight_label: "宠物向"        # 高亮行标注文字

# 输出文件
output:
  default_path: "宠物赛道对标报告.html"
